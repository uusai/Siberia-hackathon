<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI-ассистент университета</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">AI-ассистент</div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Задайте вопрос..." autocomplete="off">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
