services:
  backend:
    build: ./backend
    container_name: hackathon_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    networks:
      - hackathon_net

  frontend:
    build: ./frontend
    container_name: hackathon_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hackathon_net

  # Встраиваемый виджет для сайта вуза. Отдельный сервис и отдельный порт:
  # его подключают с ЧУЖИХ доменов, тогда как frontend — интерфейс
  # сотрудников. Разные контуры потребителей, значит разные точки входа.
  widget:
    build: ./widget
    container_name: hackathon_widget
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hackathon_net

networks:
  hackathon_net:
    driver: bridge
