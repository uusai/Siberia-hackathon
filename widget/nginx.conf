server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # По корню отдаём демонстрационную страницу-хозяина, а не сам виджет:
    # index.html — это содержимое рамки, открывать его напрямую незачем.
    location = / {
        return 302 /demo.html;
    }

    # widget.js подключают с чужих доменов, поэтому он обязан отдаваться
    # с разрешающим CORS-заголовком. Остальные файлы грузятся внутри iframe
    # с этого же origin, и им это не нужно.
    location = /widget.js {
        add_header Access-Control-Allow-Origin "*" always;
        # Виджет правится до самой защиты — кэш держим коротким, иначе на
        # чужом сайте останется вчерашняя версия.
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
